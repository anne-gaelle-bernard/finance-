<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0533"/>
      <stop offset="50%" style="stop-color:#6d28d9"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#67e8f9;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0"/>
    </radialGradient>
    <clipPath id="roundClip">
      <rect width="512" height="512"/>
    </clipPath>
  </defs>
  <!-- Full bleed background for maskable (no rounded corners) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#glowGrad)"/>
  <g clip-path="url(#roundClip)" opacity="0.07">
    <line x1="0" y1="170" x2="512" y2="170" stroke="white" stroke-width="1"/>
    <line x1="0" y1="260" x2="512" y2="260" stroke="white" stroke-width="1"/>
    <line x1="0" y1="350" x2="512" y2="350" stroke="white" stroke-width="1"/>
    <line x1="128" y1="120" x2="128" y2="430" stroke="white" stroke-width="1"/>
    <line x1="256" y1="120" x2="256" y2="430" stroke="white" stroke-width="1"/>
    <line x1="384" y1="120" x2="384" y2="430" stroke="white" stroke-width="1"/>
  </g>
  <path d="M 72 390 L 72 310 C 130 310 155 260 185 240 C 220 218 245 250 280 210 C 315 170 345 185 380 150 C 400 133 420 138 440 125 L 440 390 Z"
        fill="url(#areaGrad)"/>
  <path d="M 72 310 C 130 310 155 260 185 240 C 220 218 245 250 280 210 C 315 170 345 185 380 150 C 400 133 420 138 440 125"
        fill="none" stroke="url(#chartGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="185" cy="240" r="9" fill="white" opacity="0.7"/>
  <circle cx="280" cy="210" r="9" fill="white" opacity="0.7"/>
  <circle cx="380" cy="150" r="9" fill="white" opacity="0.7"/>
  <circle cx="440" cy="125" r="14" fill="white" opacity="0.3"/>
  <circle cx="440" cy="125" r="8" fill="white"/>
  <circle cx="168" cy="340" r="72" fill="url(#coinGrad)"/>
  <circle cx="168" cy="340" r="58" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.6"/>
  <text x="168" y="362" font-family="Georgia, serif" font-size="72" font-weight="bold"
        fill="#92400e" text-anchor="middle" opacity="0.85">€</text>
  <g transform="translate(222, 268)" opacity="0.9">
    <polygon points="0,28 14,0 28,28" fill="#34d399" />
    <rect x="9" y="28" width="10" height="18" fill="#34d399" rx="2"/>
  </g>
  <rect x="72" y="440" width="368" height="36" rx="8" fill="white" opacity="0.08"/>
  <text x="256" y="464" font-family="Arial, sans-serif" font-size="22" font-weight="700"
        fill="white" text-anchor="middle" letter-spacing="3" opacity="0.9">FINANCE</text>
