# Nixpacks Plan - Backend Only Deployment

[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "true"

[phases.setup]
nixPkgs = ["nodejs-18_x", "npm"]

[phases.install]
dependsOn = ["setup"]
cmds = [
  "cd backend && npm ci"
]

[phases.build]
dependsOn = ["install"]
cmds = ["echo 'Backend production build ready'"]

[start]
cmd = "cd backend && node server.js"
